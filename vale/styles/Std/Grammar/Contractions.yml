#
extends: substitution
message: "Use '%s' instead of '%s'."
level: suggestion
ignorecase: true
action:
  name: replace
swap:
  are not: aren't
  cannot: can't
  could not: couldn't
  did not: didn't
  do not: don't
  does not: doesn't
  has not: hasn't
  have not: haven't
  how is: how's
  is not: isn't

  'it is(?!\.)': it's
  'it''s(?=\.)': it is

  should not: shouldn't

  "that is(?![.,])": that's
  'that''s(?=\.)': that is

  'they are(?!\.)': they're
  'they''re(?=\.)': they are

  was not: wasn't

  'we are(?!\.)': we're
  'we''re(?=\.)': we are

  'we have(?!\.)': we've
  'we''ve(?=\.)': we have

  were not: weren't

  'what is(?!\.)': what's
  'what''s(?=\.)': what is

  'when is(?!\.)': when's
  'when''s(?=\.)': when is

  'where is(?!\.)': where's
  'where''s(?=\.)': where is

  will not: won't
tests:
  - name: fires
    input: >
      Do not restart the host. It is not safe, and you cannot undo it.
    want: |
      1:1:Std.Grammar.Contractions:Use 'don't' instead of 'Do not'.
      1:26:Std.Grammar.Contractions:Use 'it's' instead of 'It is'.
      1:50:Std.Grammar.Contractions:Use 'can't' instead of 'cannot'.

  - name: clean
    input: >
      Don't restart the host. It isn't safe.
    want: ""
