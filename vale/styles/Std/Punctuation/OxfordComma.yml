extends: existence
message: "Missing serial comma before '%s'."
scope: sentence
level: suggestion
nonword: true
# List items may be several words long, not just one. Four guards keep the
# false-positive rate down:
#
#   1. The comma can't be the one closing a fronted subordinate clause
#      ('When your alarm rings, you turn it off and tumble out of bed.') --
#      that comma separates clauses, not list items. Only the first comma of
#      such a sentence is exempt, so 'When it rains, apples, pears or bananas
#      get wet.' is still caught.
#   2. The item can't open with a clause-introducer (', which ...',
#      ', specifically ...').
#   3. The item can't open with a subject pronoun followed by a verb, which
#      marks a compound predicate rather than a list ('..., you walk to the
#      fridge and get a snack.'). A pronoun directly followed by 'and'/'or'
#      is a real list item, so ', you and me.' still matches.
#   4. Neither item may contain an auxiliary verb, which is another compound
#      predicate signal (', it has some downsides and is officially
#      discouraged.').
#
# The trailing anchor allows end-of-scope so list fragments ('Apples, pears
# or bananas') are still caught.
#
# Guard 4 alone would also silence a list serving as the sentence's subject
# ('Cats, dogs or birds have owners.'), since the predicate's auxiliary sits
# inside the would-be second item. The second token handles that shape: a
# sentence-initial list may end right before an auxiliary verb, provided the
# opener is not an adverbial or subordinator and the final item is short --
# a subordinate clause needs conjunction plus subject before its verb, so a
# two-word cap keeps compound predicates ('restarts, retries or fails when
# limits are reached') out.
tokens:
  - '(?<!^(?i:when|whenever|while|if|unless|until|although|though|because|since|after|before|once|whereas|whether|as)\b[^,]{0,80}),\s(?!(?:which|who|whom|whose|that|where|when|while|because|since|although|though|if|unless|so|but|and|or|however|therefore|thus|specifically|especially|namely|then|take|see|note|consider|make|use|either|neither)\b)(?!(?i:i|you|we|they|he|she|it)\s+(?!(?:and|or)\b))(?:(?!\b(?:is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did)\b)\w+ ){0,4}\w+ (?:and|or) (?:(?!\b(?:is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did)\b)\w+ ){0,4}\w+(?:[.?!]|$)'
  - '^(?!(?i:(?:when|whenever|while|if|unless|until|although|though|because|since|after|before|once|whereas|whether|as|who|which|that|however|therefore|thus|meanwhile|also|then|now|here|there|today|tomorrow|yesterday|soon|later|often|sometimes|again|instead|otherwise|still|yet|overall|first|second|third|next|last|in|on|at|by|for|with|without|within|from|to|of|under|over|during|via|per|between|among|across|around|near|inside|outside|beyond|behind|above|below|despite|regardless|according|unlike|like|through|throughout|toward|towards|upon|against|amid|beside|besides|except|versus|onto|into|about|along|yes|no|ok|okay|well|right|true|indeed|note|see|say|consider|imagine|suppose|recall|remember|is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did)\b))(?!(?:\w+ ){0,2}\w+ly,)(?:(?!(?i:who|which|that)\b)\w+ ){0,3}(?!(?i:who|which|that)\b)\w+,\s(?!(?:which|who|whom|whose|that|where|when|while|because|since|although|though|if|unless|so|but|and|or|however|therefore|thus|specifically|especially|namely|then|take|see|note|consider|make|use|either|neither|before|after|until|once|during|despite|whatever|than)\b)(?!(?:of|by|for|with|to|from|in|on|at|through)\s+(?:which|whose|whom)\b)(?!(?i:i|you|we|they|he|she|it)\b)(?:(?!\b(?:is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did)\b)\w+ ){0,2}\w+ (?:and|or) (?:(?!\b(?:is|are|was|were|has|have|had|be|been|being|will|would|can|could|should|may|might|must|do|does|did)\b)\w+ )?(?!(?i:i|you|we|they|he|she|it)\b)\w+(?= (?:is|are|was|were|has|have|had|will|would|can|could|should|may|might|must|do|does|did)\b)'
tests:
  - name: fires
    input: >
      The installer copies binaries, styles and vocabularies.
    want: |
      1:30:Std.Punctuation.OxfordComma:Missing serial comma before ', styles and vocabularies.'.

  - name: clean
    input: >
      The installer copies binaries, styles, and vocabularies.
    want: ""
