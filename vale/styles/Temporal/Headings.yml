extends: capitalization
message: "'%s' should use sentence-style capitalization."
link: "https://developers.google.com/style/capitalization#capitalization-in-titles-and-headings"
level: suggestion
scope: heading
match: $sentence
indicators:
  - ":"
# How Vale scores a heading, which decides whether a term needs an entry here:
# - A heading passes when at least 80% of its words are acceptable, so one
#   stray capital in a long heading slips through and the same word in a short
#   heading fails. Don't read "it passed elsewhere" as "it's allowed".
# - All-caps acronyms are NOT exempt on their own; they need an entry.
# - Mixed-case first words (QoS, PingFederate, ActiveRecord) need an entry.
# - The word after a ":" must be capitalized ("Example: Subgraph orchestration").
# - Inline `code` is skipped, so code identifiers belong in backticks rather
#   than in this list.
# - Single-word entries are substring-matched ("URL" also covers "URLs").
#   Multi-word entries match only the exact phrase, so list plurals too
#   ("Audit Log" and "Audit Logs").
# Add a term only when it's a proper noun or a Temporal term that docs/ body
# prose capitalizes consistently. Otherwise fix the heading.
exceptions:
  # From Google/Headings.yml
  - Azure
  - CLI
  - Cosmos
  - Docker
  - Emmet
  - gRPC
  # Word-anchored on purpose. Vale compiles these exceptions into one
  # unanchored regex and substring-matches each word, so a bare "I" exempted
  # every capitalized word containing an I -- "Interceptors", "Implementing",
  # "Involvement" were all silently allowed. \bI\b keeps the pronoun exempt
  # and nothing else.
  - \bI\b
