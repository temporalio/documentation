  - Java
  - Python
  - Ruby
  - PHP
  - Rust
  - .NET
  # Vale tokenizes the leading dot away, so ".NET" above never matches the
  # word it actually sees. Without this, every sentence-case heading naming
  # the SDK is flagged — "Temporal .NET technical resources" is reported
  # while the identical Go heading is not.
  - NET
  # Temporal feature / primitive names
  - Patching
  - Endpoint
  - Metrics
  - Account
  - Capacity
  - Connectivity
  - Continue-As-New
  - Plugin
  - Plugins
  # Activity Operations named on the Activity Operations page — capitalized
  # consistently as operation names throughout that page's headings and body
  # prose, the same treatment already given to Signal/Query/Update above.
  - Pause
  - Unpause
  - Reset
  - Terminate
  - Delete
  - Paused
  # Exact phrases; "Audit Logging" is the canonical term in Temporal/terms.yml,
  # so keep "Log"/"Logs" out of the single-word list above.
  - Audit Log
  - Audit Logs
  - Audit Logging
  # Exact phrases; the named Activity Operations, not generic bare words
  # ("cancel" as a verb, "options" as in the unrelated "Activity options").
  - Request Cancel
  - Update Options
  # Exact phrases; Retry Policy property names, capitalized as proper nouns in
  # the headings and body prose of docs/encyclopedia/retry-policies.mdx. Kept
  # as phrases so the bare words ("interval", "attempts") stay sentence-cased.
  - Initial Interval
  - Backoff Coefficient
  - Maximum Interval
  - Maximum Attempts
  - Non-Retryable Errors
  # Exact phrases; defined terms with their own acronym, capitalized wherever
  # they appear in docs/ ("Worker Controller Instance (WCI)"), and the
  # recognized industry term behind IaC.
  - Worker Controller Instance
  - Infrastructure as Code
