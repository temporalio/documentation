  - Azure Workload Identity
  - GCP Workload Identity
  - Pod Identity
  - Private Service Connect
  - Cloud Ops API
  - Terraform
  - Prometheus
  - Grafana
  # gRPC status code named literally at the start of a troubleshooting heading.
  # Only the leading word needs an entry: an all-caps acronym later in a
  # heading already passes, which is why "INTERNAL" and "ECR" are absent.
  - UNIMPLEMENTED
  # AI vendor and model-platform proper nouns
  - AI
  - Google
  - Gemini
  - Vertex
  # Temporal product/site section proper nouns (exact phrase, not the individual words)
  - AI Cookbook
  - Code Exchange
