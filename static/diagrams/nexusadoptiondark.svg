<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><defs><marker id="arrow-dark" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><path fill="#9ca3af" d="M0,0 L8,3 L0,6"/></marker><style>text{font-family:Inter,&apos;Helvetica Neue&apos;,Arial,sans-serif}</style></defs><rect width="400" height="75" x="250" y="15" fill="#3b82f6" rx="12" ry="12"/><text x="450" y="43" fill="#fff" font-size="15" font-weight="600" text-anchor="middle"><tspan x="450" dy="0">Does your use case span team, domain,</tspan> <tspan x="450" dy="1.4em">namespace, region, or cloud boundaries?</tspan></text><line x1="450" x2="450" y1="90" y2="140" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="462" y="120" fill="#e5e7eb" font-size="14" font-weight="bold">Yes</text><line x1="650" x2="775" y1="52" y2="52" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="700" y="44" fill="#e5e7eb" font-size="14" font-weight="bold">No</text><rect width="305" height="60" x="785" y="22" fill="#374151" stroke="#4b5563" stroke-width="1" rx="0" ry="0"/><text x="937" y="44" fill="#e5e7eb" font-size="14" text-anchor="middle"><tspan x="937" dy="0">Use a single namespace with</tspan> <tspan x="937" dy="1.4em">Workflows and Activities.</tspan></text><rect width="400" height="75" x="250" y="140" fill="#3b82f6" rx="12" ry="12"/><text x="450" y="168" fill="#fff" font-size="15" font-weight="600" text-anchor="middle"><tspan x="450" dy="0">Do you need separate namespaces for</tspan> <tspan x="450" dy="1.4em">security, fault isolation, or modularity?</tspan></text><line x1="350" x2="175" y1="215" y2="275" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="280" y="226" fill="#e5e7eb" font-size="14" font-weight="bold">Yes</text><line x1="550" x2="720" y1="215" y2="275" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="615" y="225" fill="#e5e7eb" font-size="14" font-weight="bold">No</text><rect width="290" height="75" x="30" y="275" fill="#3b82f6" rx="12" ry="12"/><text x="175" y="303" fill="#fff" font-size="14.5" font-weight="600" text-anchor="middle"><tspan x="175" dy="0">Is Nexus SDK support available</tspan> <tspan x="175" dy="1.4em">for your language?</tspan></text><line x1="100" x2="90" y1="350" y2="410" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="112" y="385" fill="#e5e7eb" font-size="14" font-weight="bold">Yes</text><line x1="250" x2="335" y1="350" y2="410" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="305" y="368" fill="#e5e7eb" font-size="14" font-weight="bold">No</text><rect width="320" height="75" x="560" y="275" fill="#3b82f6" rx="12" ry="12"/><text x="720" y="303" fill="#fff" font-size="14.5" font-weight="600" text-anchor="middle"><tspan x="720" dy="0">Do you plan to split into separate</tspan> <tspan x="720" dy="1.4em">namespaces later?</tspan></text><line x1="680" x2="680" y1="350" y2="410" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="692" y="385" fill="#e5e7eb" font-size="14" font-weight="bold">Yes</text><line x1="810" x2="1025" y1="350" y2="410" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="895" y="360" fill="#e5e7eb" font-size="14" font-weight="bold">No</text><rect width="150" height="45" x="15" y="415" fill="#22c55e" rx="12" ry="12"/><text x="90" y="443" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">✓ Use Nexus</text><rect width="270" height="70" x="200" y="410" fill="#3b82f6" rx="12" ry="12"/><text x="335" y="437" fill="#fff" font-size="14.5" font-weight="600" text-anchor="middle"><tspan x="335" dy="0">Is cross-namespace a future</tspan> <tspan x="335" dy="1.4em">goal, not urgent now?</tspan></text><line x1="270" x2="200" y1="480" y2="550" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="248" y="490" fill="#e5e7eb" font-size="14" font-weight="bold">Yes</text><line x1="400" x2="560" y1="480" y2="550" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="465" y="496" fill="#e5e7eb" font-size="14" font-weight="bold">No</text><rect width="280" height="80" x="540" y="410" fill="#22c55e" rx="12" ry="12"/><text x="680" y="434" fill="#fff" font-size="14" font-weight="700" text-anchor="middle"><tspan x="680" dy="0">✓ Use Nexus in a single namespace</tspan> <tspan x="680" dy="1.4em">for separation of concerns and</tspan> <tspan x="680" dy="1.4em">easier future migration.</tspan></text><rect width="300" height="70" x="875" y="410" fill="#3b82f6" rx="12" ry="12"/><text x="1025" y="437" fill="#fff" font-size="14.5" font-weight="600" text-anchor="middle"><tspan x="1025" dy="0">Need cleaner contracts than</tspan> <tspan x="1025" dy="1.4em">Child Workflows provide?</tspan></text><line x1="875" x2="820" y1="445" y2="445" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="843" y="437" fill="#e5e7eb" font-size="14" font-weight="bold">Yes</text><line x1="1025" x2="810" y1="480" y2="550" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-dark)"/><text x="935" y="496" fill="#e5e7eb" font-size="14" font-weight="bold">No</text><rect width="340" height="60" x="30" y="550" fill="#22c55e" rx="12" ry="12"/><text x="200" y="572" fill="#fff" font-size="14" font-weight="700" text-anchor="middle"><tspan x="200" dy="0">✓ Build in isolated namespaces now.</tspan> <tspan x="200" dy="1.4em">Use Nexus to connect them later.</tspan></text><rect width="480" height="60" x="440" y="550" fill="#374151" stroke="#4b5563" stroke-width="1" rx="0" ry="0"/><text x="680" y="572" fill="#e5e7eb" font-size="14" text-anchor="middle"><tspan x="680" dy="0">Use Child Workflows in a single namespace.</tspan> <tspan x="680" dy="1.4em">Migration to Nexus is straightforward later.</tspan></text><rect width="18" height="18" x="15" y="685" fill="#3b82f6" rx="8" ry="8"/><text x="40" y="699" fill="#e5e7eb" font-size="13">Question</text><rect width="18" height="18" x="130" y="685" fill="#22c55e" rx="8" ry="8"/><text x="155" y="699" fill="#e5e7eb" font-size="13">Use Nexus</text><rect width="18" height="18" x="255" y="685" fill="#374151" stroke="#4b5563" stroke-width="1" rx="0" ry="0"/><text x="280" y="699" fill="#e5e7eb" font-size="13">Alternative path</text></svg>