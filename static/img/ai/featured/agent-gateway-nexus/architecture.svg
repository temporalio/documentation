<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">Pinecrest agent gateway architecture</title><desc id="arch-desc">Claude Code, as Noah's agent, connects over MCP to the gateway's front door in the platform Namespace. Each tool call becomes an Update on an AgentSessionWorkflow, which checks the ToolRegistryWorkflow's tools and policy, then calls a team's Nexus Service through that team's Endpoint: release-eng-tools into the release-eng Namespace (the release status read and the DeployWorkflow) and security-tools into the security Namespace (the Update-backed review on the ReviewDeskWorkflow). Each team registers its own tools by running a PublishToolsWorkflow in its own Namespace, which calls Platform's Registration Service through the team's registration Endpoint, platform-registry-release-eng or platform-registry-security. The security Namespace and its two Endpoints don't exist at the start; they are created when Security joins. The release console reads every Namespace with Queries and sends people's decisions as Updates.</desc><defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8F86B8"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5CC0FF"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF9F43"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F78FD6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B48CFF"/></marker></defs><rect width="1280" height="780" rx="16" fill="#13111C"/><rect x="270" y="70" width="380" height="600" rx="14" fill="#1E1A2E" stroke="#B48CFF" stroke-width="2"/><text x="286" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#B48CFF">Namespace: platform (Platform team)</text><rect x="870" y="70" width="370" height="300" rx="14" fill="#1E1A2E" stroke="#FF9F43" stroke-width="2"/><text x="886" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FF9F43">Namespace: release-eng</text><rect x="870" y="400" width="370" height="270" rx="14" fill="#1E1A2E" stroke="#F78FD6" stroke-width="2" stroke-dasharray="9 6"/><text x="886" y="426" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F78FD6">Namespace: security (joins during the demo)</text><line x1="760" y1="60" x2="760" y2="690" stroke="#8F86B8" stroke-width="1.5" stroke-dasharray="4 6"/><text x="760" y="50" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E4E0F7">Nexus Endpoints</text><rect x="40" y="120" width="190" height="60" rx="10" fill="#2A2640" stroke="#5CC0FF" stroke-width="1.5"/><text x="54" y="144" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F1FF">Claude Code</text><text x="54" y="164" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">Noah's agent</text><rect x="40" y="530" width="190" height="84" rx="10" fill="#2A2640" stroke="#8F86B8" stroke-width="1.5"/><text x="54" y="554" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F1FF">Release console</text><text x="54" y="574" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">Queries every Namespace;</text><text x="54" y="592" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">decisions go in as Updates</text><rect x="300" y="115" width="320" height="62" rx="10" fill="#2A2640" stroke="#B48CFF" stroke-width="1.5"/><text x="314" y="139" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F1FF">MCP front door</text><text x="314" y="159" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">a standard MCP server over HTTP</text><rect x="300" y="245" width="320" height="82" rx="10" fill="#2A2640" stroke="#B48CFF" stroke-width="1.5"/><text x="314" y="269" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F4F1FF">AgentSessionWorkflow</text><text x="314" y="289" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">one per person per client:</text><text x="314" y="307" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">policy, approval holds, audit</text><rect x="300" y="395" width="320" height="62" rx="10" fill="#2A2640" stroke="#B48CFF" stroke-width="1.5"/><text x="314" y="419" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F4F1FF">ToolRegistryWorkflow</text><text x="314" y="439" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">registered tools and the active policy</text><rect x="300" y="530" width="320" height="70" rx="10" fill="#2A2640" stroke="#B48CFF" stroke-width="1.5"/><text x="314" y="554" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F1FF">Registration Service</text><text x="314" y="574" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">PlatformRegistry.register_tool,</text><text x="314" y="592" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">team read from the Endpoint</text><rect x="895" y="108" width="320" height="62" rx="10" fill="#2A2640" stroke="#FF9F43" stroke-width="1.5"/><text x="909" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F1FF">ReleaseEngineering Service</text><text x="909" y="152" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">get_release_status (sync), deploy</text><rect x="895" y="182" width="320" height="40" rx="10" fill="#2A2640" stroke="#FF9F43" stroke-width="1.5"/><text x="909" y="206" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F4F1FF">EnvironmentLedgerWorkflow</text><rect x="895" y="232" width="320" height="40" rx="10" fill="#2A2640" stroke="#FF9F43" stroke-width="1.5"/><text x="909" y="256" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F4F1FF">DeployWorkflow</text><rect x="895" y="300" width="320" height="46" rx="10" fill="#2A2640" stroke="#FF9F43" stroke-width="1.5"/><text x="909" y="324" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F4F1FF">PublishToolsWorkflow</text><rect x="895" y="438" width="320" height="62" rx="10" fill="#2A2640" stroke="#F78FD6" stroke-width="1.5"/><text x="909" y="462" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F1FF">SecurityReview Service</text><text x="909" y="482" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">review_release (Update-backed)</text><rect x="895" y="512" width="320" height="62" rx="10" fill="#2A2640" stroke="#F78FD6" stroke-width="1.5"/><text x="909" y="536" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F4F1FF">ReviewDeskWorkflow</text><text x="909" y="556" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CFC9EA">reviewer agent, then a person decides</text><rect x="895" y="600" width="320" height="46" rx="10" fill="#2A2640" stroke="#F78FD6" stroke-width="1.5"/><text x="909" y="624" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F4F1FF">PublishToolsWorkflow</text><rect x="653.0" y="126" width="214" height="26" rx="13" fill="#13111C" stroke="#FF9F43" stroke-width="1.5"/><text x="760" y="143.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#F4F1FF">release-eng-tools</text><rect x="653.0" y="310" width="214" height="26" rx="13" fill="#13111C" stroke="#B48CFF" stroke-width="1.5"/><text x="760" y="327.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#F4F1FF">platform-registry-release-eng</text><rect x="653.0" y="456" width="214" height="26" rx="13" fill="#13111C" stroke="#F78FD6" stroke-width="1.5"/><text x="760" y="473.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#F4F1FF">security-tools</text><rect x="653.0" y="610" width="214" height="26" rx="13" fill="#13111C" stroke="#B48CFF" stroke-width="1.5"/><text x="760" y="627.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#F4F1FF">platform-registry-security</text><path d="M230,150 L296,150" fill="none" stroke="#5CC0FF" stroke-width="1.8" marker-end="url(#a-sky)"/><text x="246" y="142" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CFC9EA">MCP</text><path d="M460,177 L460,241" fill="none" stroke="#8F86B8" stroke-width="1.8" marker-end="url(#a-line)"/><text x="468" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CFC9EA">Update</text><path d="M460,327 L460,391" fill="none" stroke="#8F86B8" stroke-width="1.8" marker-end="url(#a-line)"/><text x="468" y="364" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CFC9EA">reads</text><path d="M460,530 L460,461" fill="none" stroke="#8F86B8" stroke-width="1.8" marker-end="url(#a-line)"/><text x="468" y="500" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CFC9EA">Update</text><path d="M230,560 C266,560 264,300 296,300" fill="none" stroke="#8F86B8" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#a-line)"/><text x="256" y="452" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CFC9EA">Queries,</text><text x="256" y="468" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CFC9EA">Updates</text><path d="M620,270 C640,270 636,139 649,139" fill="none" stroke="#8F86B8" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M867,139 L891,139" fill="none" stroke="#FF9F43" stroke-width="1.8" marker-end="url(#a-orange)"/><path d="M620,300 C632,300 630,469 649,469" fill="none" stroke="#8F86B8" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M867,469 L891,469" fill="none" stroke="#F78FD6" stroke-width="1.8" marker-end="url(#a-pink)"/><path d="M895,323 L871,323" fill="none" stroke="#FF9F43" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a-orange)"/><path d="M653,323 C644,323 646,555 624,555" fill="none" stroke="#B48CFF" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a-violet)"/><path d="M895,623 L871,623" fill="none" stroke="#F78FD6" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a-pink)"/><path d="M653,623 C636,623 640,580 624,580" fill="none" stroke="#B48CFF" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a-violet)"/><line x1="40" y1="728" x2="84" y2="728" stroke="#8F86B8" stroke-width="1.8" marker-end="url(#a-line)"/><text x="94" y="732.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#E4E0F7">tool call over Nexus</text><line x1="270" y1="728" x2="314" y2="728" stroke="#B48CFF" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a-violet)"/><text x="324" y="732.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#E4E0F7">a team registers its tools over Nexus, from its own Namespace</text><rect x="760" y="717" width="40" height="22" rx="6" fill="none" stroke="#F78FD6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="810" y="732.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#E4E0F7">absent at start; created when Security joins</text></svg>
