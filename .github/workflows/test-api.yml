name: Test API Functions

# Runs the unit and handler tests for the Vercel Functions in api/. Blob and
# Kapa are stubbed, so the tests need no secrets. vercel.json and
# bin/redirect-utils.js are in the paths because the functions load the
# redirect rules at runtime.

on:
  pull_request:
    paths:
      - "api/**"
      - "bin/redirect-utils.js"
      - "vercel.json"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/test-api.yml"

permissions:
  contents: read

jobs:
  test-api:
    name: Test api/ functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # A directory argument isn't expanded, so pass a glob.
      - name: Run tests
        run: node --test 'api/*.test.js'
