name: Vale CI

on:
  pull_request:
    paths:
      - "docs/**"
      # Lint the ruleset changes too. A malformed style file makes Vale exit 2
      # and skip linting entirely, which would otherwise fail open on every
      # later PR without anything having flagged it here.
      - "vale/**"
      - ".vale-ci.ini"
      - ".github/workflows/vale-ci.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    name: Lint prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: vale-cli/vale-action@2.1.2
        with:
          reporter: github-pr-review
          level: info
          filter_mode: diff_context
          fail_on_error: false
          # Scope linting to docs only; do not put the path in vale_flags —
          # the action runs `vale ${vale_flags} sync`, so a path there breaks sync.
          files: docs
          vale_flags: "--config=.vale-ci.ini"
