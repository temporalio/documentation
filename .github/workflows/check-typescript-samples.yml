name: Check TypeScript Samples

# Type-checks the hand-written TypeScript and JavaScript samples in docs/
# against the latest published @temporalio packages, and reports SDK methods,
# properties, and exports that the samples use but the packages don't have.
# The same pass checks docs links written in code comments.
#
# This is advisory. Findings never fail the job: the packages are fetched at
# their latest version, so an SDK release can break a sample without any docs
# change, and a page may deliberately show an older API. On pull requests it
# annotates the changed pages. On its weekly run it opens a tracking issue,
# updates it while findings remain, and closes it once they're gone. The job
# fails only when the check can't run at all, for example when npm is
# unreachable.

on:
  schedule:
    # Mondays at 11:00 UTC.
    - cron: '0 11 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/develop/typescript/**'
      - 'bin/check-typescript-samples.js'
      - 'bin/check-typescript-samples.test.js'
      - 'bin/typescript-samples-baseline.json'
      - '.github/workflows/check-typescript-samples.yml'

permissions:
  contents: read

concurrency:
  group: check-typescript-samples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check samples against the SDK packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull requests diff against their base to find the changed pages.
          # (0 is falsy in an expression, so the condition is written this way.)
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Test the checker
        run: node --test bin/check-typescript-samples.test.js

      # A pull request that changes the checker gets a full scan. Otherwise it
      # gets only the pages it changes, so it isn't annotated with findings on
      # pages it didn't touch.
      - name: Choose the pages to check
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD)
          if echo "$changed" | grep -qE '^(bin/check-typescript-samples|bin/typescript-samples-baseline|\.github/workflows/check-typescript-samples)'; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pages=$(echo "$changed" | grep -E '^docs/.*\.mdx$' | tr '\n' ' ' || true)
          if [ -z "$pages" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pages" >> "$GITHUB_OUTPUT"
            echo "pages=$pages" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the samples
        id: check
        if: steps.scope.outputs.mode != 'none'
        env:
          PAGES: ${{ steps.scope.outputs.pages }}
        run: |
          set -f
          set +e
          # --github adds a workflow command per finding, which annotates the
          # page as tee echoes it. The report proper is everything else.
          node bin/check-typescript-samples.js --github $PAGES 2>&1 | tee output.txt
          status=${PIPESTATUS[0]}
          set -e

          grep -v '^::' output.txt > report.txt || true

          # 0 is clean and 2 is findings. Anything else means the check could
          # not run, usually because npm or a package download failed.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::The TypeScript sample check could not run. See the log above."
            exit "$status"
          fi

          if [ "$status" -eq 2 ]; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "findings=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### TypeScript samples (informational; does not block merge)"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        if: >-
          github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch &&
          steps.check.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Hand-written TypeScript samples need fixes'
        run: |
          {
            echo "\`bin/check-typescript-samples.js\` found hand-written TypeScript samples in"
            echo "\`docs/\` that use SDK APIs the latest @temporalio packages don't have, or"
            echo "docs links in code comments that don't resolve."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "To resolve, fix the sample, or record the finding with a note in"
            echo "\`bin/typescript-samples-baseline.json\` if the page shows that API on purpose."
            echo "Reproduce locally with \`yarn check:ts-samples\`."
            echo
            echo "_Updated by [${GITHUB_WORKFLOW}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > issue-body.md

          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue-body.md
            echo "Updated issue #$number."
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi

      - name: Close the tracking issue
        if: >-
          github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch &&
          steps.check.outputs.findings == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Hand-written TypeScript samples need fixes'
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The checker no longer finds anything to fix."
          fi
