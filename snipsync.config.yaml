origins:
  - owner: temporalio
    repo: temporal
  - owner: temporalio
    repo: samples-php
  - owner: temporalio
    repo: samples-typescript
  - owner: temporalio
    repo: samples-python
  - owner: temporalio
    repo: reference-app-orders-go
  - owner: temporalio
    repo: features

  # Some samples were left in the SDK code itself because it has better testing
  # capabilities than the samples repo
  - owner: temporalio
    repo: sdk-typescript
  - owner: temporalio
    repo: samples-go
  - owner: temporalio
    repo: samples-ruby
  - owner: temporalio
    repo: samples-dotnet
    ref: ea/aws-lambda
  - owner: temporalio
    repo: samples-java
    ref: ea/aws-lambda
  - owner: temporalio
    repo: features
  - owner: temporalio
    repo: reference-app-orders-go
  - files:
      pattern: './sample-apps/**/*.go'
      owner: 'temporalio'
      repo: 'documentation'
      ref: 'main'
  - files:
      pattern: './sample-apps/**/*.java'
      owner: 'temporalio'
      repo: 'documentation'
      ref: 'main'
  - owner: temporalio
    repo: samples-server
    ref: 'main'
  - owner: temporalio
    repo: sdk-go

targets:
  - docs

features:
  enable_source_link: true
  enable_code_block: true
  # Without this, snipsync scans every file under `targets` (docs/), including
  # binary assets. It reads/writes files line-by-line as UTF-8 text, which
  # corrupts any PNG/SVG in its path (invalid UTF-8 bytes become U+FFFD).
  # See: https://github.com/temporalio/documentation/pull/4908
  allowed_target_extensions: [.md, .mdx]
